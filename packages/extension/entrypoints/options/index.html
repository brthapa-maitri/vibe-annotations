<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="manifest.open_in_tab" content="true">
  <title>Annotations Setup</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #141414; color: #ececec; padding: 24px 16px;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    main { width: 100%; max-width: 440px; background: #1e1e1e; border: 1px solid #2e2e2e; border-radius: 14px; padding: 28px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.lead { margin: 0 0 20px; color: #a3a3a3; }
    label { display: block; font-size: 12px; color: #a3a3a3; margin: 14px 0 6px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background: #141414;
      color: inherit; font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input:focus { outline: none; border-color: #d97757; }
    button {
      margin-top: 20px; width: 100%; padding: 11px; border: 0; border-radius: 8px; cursor: pointer;
      background: linear-gradient(90deg, #E85B5C, #D03D68); color: #fff; font-weight: 600; font-size: 14px;
    }
    button:disabled { opacity: .6; cursor: default; }
    .status { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
    .status.show { display: block; }
    .status.ok { background: rgba(74, 222, 128, .12); color: #86efac; }
    .status.err { background: rgba(248, 113, 113, .12); color: #fca5a5; }
    .status.info { background: #262626; color: #d4d4d4; }
    .hint { margin-top: 16px; font-size: 12px; color: #7a7a7a; }
  </style>
</head>
<body>
  <main>
    <h1>Connect to your annotations server</h1>
    <p class="lead" id="lead">Enter the server URL and your personal token.</p>
    <form id="form" autocomplete="off">
      <label for="url">Server URL</label>
      <input id="url" type="url" spellcheck="false" placeholder="http://127.0.0.1:3846">
      <label for="token">Token</label>
      <input id="token" type="password" spellcheck="false" placeholder="Leave empty for a local server">
      <button id="save" type="submit">Connect</button>
    </form>
    <div id="status" class="status" role="status"></div>
    <p class="hint">Leave the URL empty to use a server on this machine. You can change these later from the toolbar's settings.</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
